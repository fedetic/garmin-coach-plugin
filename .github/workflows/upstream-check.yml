name: Upstream check

# Weekly: is there a newer Taxuspt/garmin_mcp commit or garminconnect release than we pin?
# Opens (or updates) one issue labelled `upstream` with the diff link, commits and an
# automated scan. It never bumps anything: the pin exists so a human reviews first.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare pins with upstream
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/check_upstream.py > body.md
          if [ -s body.md ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "Everything is current."; fi

      - name: Open or update the issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create upstream --color 5319e7 --description "Pinned dependency has a newer version" --force
          title="Upstream update available: garmin_mcp / garminconnect"
          num=$(gh issue list --label upstream --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file body.md
            echo "Updated issue #$num"
          else
            gh issue create --title "$title" --label upstream --body-file body.md
          fi
